services:
  # ── Web Service (Node.js + Vite build) ──────────────────────
  - type: web
    name: portofolio-kholis
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: KERNEL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OSINT_DAILY_LIMIT
        value: "3"
      - key: APIFY_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: portofolio-db
          property: connectionString

# ── PostgreSQL Database ────────────────────────────────────────
databases:
  - name: portofolio-db
    databaseName: portofolio_db
    user: kholis
    plan: free
